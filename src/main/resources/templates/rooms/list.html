<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rooms</title>
    <th:block th:replace="~{fragments/layout :: headLinks}"/>
</head>
<body class="container py-4">
<div th:replace="~{fragments/layout :: navbar}"></div>

<h1>Rooms</h1>
<a th:href="@{/rooms/new}" class="btn btn-primary mb-3">Add room</a>
<table class="table table-striped">
    <thead>
    <tr><th>ID</th><th>Name</th><th>Capacity</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="r : ${rooms}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.name}"></td>
        <td th:text="${r.capacity}"></td>
        <td>
            <a th:href="@{/rooms/{id}/edit(id=${r.id})}" class="btn btn-sm btn-warning">Edit</a>
            <form th:action="@{/rooms/{id}/delete(id=${r.id})}" method="post" class="d-inline">
                <button class="btn btn-sm btn-danger" onclick="return confirm('Delete this room?')">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
